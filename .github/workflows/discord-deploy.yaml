name: Discord Deployment Notification
on:
  deployment_status:

jobs:
  notify:
    # Any job with an `environment:` makes GitHub create a deployment and post
    # deployment_status events, so ci.yaml's e2e job (environment: TEST) was
    # firing this workflow too - twice per push, since CI runs on both `push`
    # and `pull_request`. Those arrived as "Vercel Deployment: Success/Failed"
    # for a deployment that never happened, and read as duplicates because the
    # substitution below turns Vercel's "Preview" into "Test".
    #
    # Only Vercel's own environments notify. The body already assumes exactly
    # these two names, branching on Production for the live URL.
    if: >-
      ${{ contains(fromJSON('["Preview", "Production"]'), github.event.deployment.environment)
      && (github.event.deployment_status.state == 'success'
      || github.event.deployment_status.state == 'failure'
      || github.event.deployment_status.state == 'error') }}
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          ACTOR="${{ github.actor }}"
          SHA="${{ github.event.deployment.sha }}"
          REF="${{ github.event.deployment.ref }}"
          ENV="${{ github.event.deployment.environment }}"
          ENV="${ENV/Preview/Test}"
          STATE="${{ github.event.deployment_status.state }}"
          TIMESTAMP="${{ github.event.deployment_status.created_at }}"

          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            BRANCH=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/$SHA/branches-where-head" \
              | jq -r '.[0].name // "unknown"')
          else
            BRANCH="$REF"
          fi

          COMMIT_MSG=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA" \
            | jq -r '.commit.message | split("\n")[0]')

          if [ "$ENV" = "Production" ]; then
            DEPLOY_URL="https://www.quicktalog.app/"
          else
            DEPLOY_URL="https://test.quicktalog.app/"
          fi

          if [ "$STATE" = "success" ]; then
            COLOR=3066993
            TITLE="Vercel Deployment: Success"
            DESC=$(printf '**Repo:** %s\n**Branch:** %s\n**Env:** %s\n**Commit:** `%s`\n**Message:** %s\n**Deployer:** %s\n[View deployment](%s)' "$REPO" "$BRANCH" "$ENV" "${SHA:0:7}" "$COMMIT_MSG" "$ACTOR" "$DEPLOY_URL")
          else
            COLOR=15158332
            TITLE="Vercel Deployment: Failed"
            DESC=$(printf '**Repo:** %s\n**Branch:** %s\n**Env:** %s\n**Commit:** `%s`\n**Message:** %s\n**Deployer:** %s' "$REPO" "$BRANCH" "$ENV" "${SHA:0:7}" "$COMMIT_MSG" "$ACTOR")
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESC" \
            --argjson color "$COLOR" \
            --arg timestamp "$TIMESTAMP" \
            '{embeds:[{title: $title, description: $description, color: $color, timestamp: $timestamp}]}')

          curl -s -H "Content-Type: application/json" -X POST \
            -d "$PAYLOAD" "${WEBHOOK_URL}"

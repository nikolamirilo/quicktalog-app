name: Discord Deployment Notification
on:
  deployment:
  deployment_status:

jobs:
  notify:
    if: ${{ github.event_name == 'deployment' || github.event.deployment_status.state != 'inactive' }}
    runs-on: ubuntu-latest
    steps:
      - name: Restore Discord message ID
        uses: actions/cache@v4
        with:
          path: discord-msg-id.txt
          key: discord-msg-${{ github.event.deployment.id }}

      - name: Send or update Discord notification
        env:
          WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          REPO="${{ github.repository }}"
          ACTOR="${{ github.actor }}"
          SHA="${{ github.event.deployment.sha }}"
          REF="${{ github.event.deployment.ref }}"
          ENV="${{ github.event.deployment.environment }}"
          ENV="${ENV/Preview/Test}"

          if [ "${{ github.event_name }}" = "deployment" ]; then
            STATE="in_progress"
            TIMESTAMP="${{ github.event.deployment.created_at }}"
          else
            STATE="${{ github.event.deployment_status.state }}"
            TIMESTAMP="${{ github.event.deployment_status.created_at }}"
          fi

          if [[ "$REF" =~ ^[0-9a-f]{40}$ ]]; then
            BRANCH=$(curl -s \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/commits/$SHA/branches-where-head" \
              | jq -r '.[0].name // "unknown"')
          else
            BRANCH="$REF"
          fi

          COMMIT_MSG=$(curl -s \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$REPO/commits/$SHA" \
            | jq -r '.commit.message | split("\n")[0]')

          if [ "$ENV" = "Production" ]; then
            DEPLOY_URL="https://www.quicktalog.app/"
          else
            DEPLOY_URL="https://test.quicktalog.app/"
          fi

          if [ "$STATE" = "success" ]; then
            COLOR=3066993
            TITLE="Vercel Deployment: Success"
            DESC=$(printf '**Repo:** %s\n**Branch:** %s\n**Env:** %s\n**Commit:** `%s`\n**Message:** %s\n**Deployer:** %s\n[View deployment](%s)' "$REPO" "$BRANCH" "$ENV" "${SHA:0:7}" "$COMMIT_MSG" "$ACTOR" "$DEPLOY_URL")
          elif [ "$STATE" = "failure" ] || [ "$STATE" = "error" ]; then
            COLOR=15158332
            TITLE="Vercel Deployment: Failed"
            DESC=$(printf '**Repo:** %s\n**Branch:** %s\n**Env:** %s\n**Commit:** `%s`\n**Message:** %s\n**Deployer:** %s' "$REPO" "$BRANCH" "$ENV" "${SHA:0:7}" "$COMMIT_MSG" "$ACTOR")
          else
            COLOR=3447003
            TITLE="Vercel Deployment: In Progress"
            DESC=$(printf '**Repo:** %s\n**Branch:** %s\n**Env:** %s\n**Commit:** `%s`\n**Message:** %s\n**Deployer:** %s' "$REPO" "$BRANCH" "$ENV" "${SHA:0:7}" "$COMMIT_MSG" "$ACTOR")
          fi

          PAYLOAD=$(jq -n \
            --arg title "$TITLE" \
            --arg description "$DESC" \
            --argjson color "$COLOR" \
            --arg timestamp "$TIMESTAMP" \
            '{embeds:[{title: $title, description: $description, color: $color, timestamp: $timestamp}]}')

          if [ -f discord-msg-id.txt ] && MSG_ID=$(cat discord-msg-id.txt) && [ -n "$MSG_ID" ] && [ "$MSG_ID" != "null" ]; then
            curl -s -H "Content-Type: application/json" -X PATCH \
              -d "$PAYLOAD" "${WEBHOOK_URL}/messages/${MSG_ID}"
          else
            RESPONSE=$(curl -s -H "Content-Type: application/json" -X POST \
              -d "$PAYLOAD" "${WEBHOOK_URL}?wait=true")
            echo "$RESPONSE" | jq -r '.id' > discord-msg-id.txt
          fi

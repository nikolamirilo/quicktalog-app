project_id = "quicktalog"

[api]
enabled = true
port = 54321
# Expose the public schema, which contains your users and subscriptions tables
schemas = ["public"]
# Include extensions for additional functionality (e.g., UUID for user IDs)
extra_search_path = ["public", "extensions"]
# Limit payload size to prevent large queries; adjust as needed
max_rows = 1000

[db]
port = 54322
# Must match the hosted projects: the app roles use GRANT ... WITH INHERIT FALSE,
# SET TRUE, which needs PostgreSQL 16 or newer.
major_version = 17

[db.seed]
sql_paths = ["./seed.sql"]

[auth]
enabled = true
# This file configures the LOCAL stack only; TEST and PROD are configured
# through scripts/supabase/auth-config.ts.
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/**", "http://127.0.0.1:3000/**"]
minimum_password_length = 8
# Token expiry (1 hour default is fine for most use cases)
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Allow email signups to map Paddle customer_id to user emails
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
# Require email confirmation for security (recommended for Paddle integration)
enable_confirmations = true
# Prevent frequent email sends to avoid abuse
max_frequency = "1s"
# An email change must be confirmed from both the old and the new address, and
# a password change requires the current password.
double_confirm_changes = true
secure_password_change = true